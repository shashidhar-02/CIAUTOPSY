name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Static Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # pinned to v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7 # pinned to v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check .

      - name: Check Formatting with Ruff
        run: python -m ruff format --check .

      - name: Run Static Type Check with Mypy
        run: python -m mypy src/ciautopsy

  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        run: python -m pytest --cov=ciautopsy --cov-report=term-missing

      - name: Run Synthetic Diagnostic Benchmark
        run: python scripts/run_benchmark.py

      - name: Validate Example Reports & CLI Execution
        run: python scripts/validate_examples.py

  build-validation:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with Twine
        run: python -m twine check dist/*

      - name: Test installation from built wheel
        run: |
          python -m venv test-install-env
          test-install-env/bin/python -m pip install dist/*.whl
          test-install-env/bin/ciautopsy version
          test-install-env/bin/ciautopsy rules
